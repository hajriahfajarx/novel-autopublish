name: Daily chapter auto-publish

# A single daily publish window (21:00-22:00 WIB -- offset from the tech
# blog sibling project's 19:00-20:30 WIB evening window so they don't
# overlap and compete for the same shared Gemini API key's per-minute rate
# limit) with 4 small cron triggers spread across it (every 15 min). A
# dependency-free pre-check (scripts/check-slot.mjs) picks exactly one per
# day via a deterministic hash of today's date -- the other 3 exit in a
# couple of seconds without installing anything. See scripts/check-slot.mjs
# for the slot map; it must stay in sync with the cron entries below.
on:
  schedule:
    # COMPENSATED: configured 12:22-13:37 UTC for a real-world landing
    # around 22:00-23:30 WIB (GitHub was observed delivering this account's
    # triggers ~2.5-3h late). See scripts/check-slot.mjs for details.
    - cron: "22 12 * * *"
    - cron: "37 12 * * *"
    - cron: "52 12 * * *"
    - cron: "7 13 * * *"
    - cron: "22 13 * * *"
    - cron: "37 13 * * *"
  workflow_dispatch: {}

jobs:
  check-slot:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          PUBLISH_TIMEZONE: ${{ secrets.PUBLISH_TIMEZONE }}
        run: node scripts/check-slot.mjs

  publish:
    needs: check-slot
    if: needs.check-slot.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run daily chapter pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SERIES_LABEL: ${{ secrets.SERIES_LABEL }}
          PUBLISH_TIMEZONE: ${{ secrets.PUBLISH_TIMEZONE }}
        run: npm run run
